<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- fin Boostrap -->
    <!-- Iconos boostrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- fin Iconos boostrap-->
    <title>Registro | Ecommerce</title>
</head>

<body>
    <nav id="nav"></nav>
    <h1 class="text-center pt-4">Registro de usuario</h1>

    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row gap-3" id="form-register">
                <div class="mb-3 col-auto">
                    <label for="name" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Jane Doe">
                </div>
                <div class="mb-3 col-auto">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="jane@doe.com">
                </div>
                <div class="mb-3 col-auto">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="******">
                </div>
                <div class="mb-3 col-auto">
                    <label for="repeat-password" class="form-label">Confirmar contraseña</label>
                    <input type="password" class="form-control" id="repeat-password" name="repeatPassword"
                        placeholder="******">
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Telefono (opcional)</label>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="jane+569xxxxxxxx">
                </div>
                <div class="col-auto"><label for="exampleDataList" class="form-label">Región</label>
                    <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Región..."
                        name="region">
                    <datalist id="datalistOptions">
                        <option value="San Francisco">
                        <option value="New York">
                        <option value="Seattle">
                        <option value="Los Angeles">
                        <option value="Chicago">
                    </datalist>
                </div>
                <div class="col-auto"><label for="exampleDataList" class="form-label">Comuna</label>
                    <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Comuna..."
                        name="comuna">
                    <datalist id="datalistOptions">
                        <option value="San Francisco">
                        <option value="New York">
                        <option value="Seattle">
                        <option value="Los Angeles">
                        <option value="Chicago">
                    </datalist>
                </div>
                <div><button type="submit" class="btn btn-success">Crear usuario</button></div>
            </form>

        </div>
        <div class="col-3"></div>
    </div>

    <!--Scripts-->
    <script src="../utils/getUserList.js"></script>
    <script src="../components/navbar.js"></script>
    <script src="../utils/registerForm.js"></script>

</body>

</html>
