<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- fin Boostrap -->
    <!-- Iconos boostrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <!-- fin Iconos boostrap-->
    <link rel="stylesheet" href="../../style.css">

    <title>Empleados | Ecommerce</title>
</head>

<body class="vh-100">
    <div class="container-fluid p- m-0 h-100">
        <div class="row h-100">
            <div id="nav"></div>
            <div class="col-10 bg-dark p-4">
                <p class="fs-1 text-white">Hola administrador</p>
                <div class="row">
                    <!--inicio formulario-->
                    <div class="col-6">
                        <form class="row bg-white rounded-4 shadow fs-7" id="form-register">
                            <p class="fs-6">Agregar usuario</p>
                            <div class="mb-3 col-6">
                                <label for="name" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control fs-7" id="name" name="name"
                                    placeholder="Jane Doe">
                            </div>
                            <div class="mb-3 col-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control fs-7" id="email" name="email"
                                    placeholder="jane@doe.com">
                            </div>
                            <div class="mb-3 col-6">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control fs-7" id="password" name="password"
                                    placeholder="******">
                            </div>
                            <div class="mb-3 col-6">
                                <label for="repeat-password" class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control fs-7" id="repeat-password"
                                    name="repeatPassword" placeholder="******">
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Telefono (opcional)</label>
                                <input type="tel" class="form-control fs-7" id="phone" name="phone"
                                    placeholder="jane+569xxxxxxxx">
                            </div>
                            <div class="col-6"><label for="exampleDataList" class="form-label">Región</label>
                                <input class="form-control fs-7" list="datalistOptions" id="exampleDataList"
                                    placeholder="Región..." name="region">
                                <datalist id="datalistOptions">
                                    <option value="San Francisco">
                                    <option value="New York">
                                    <option value="Seattle">
                                    <option value="Los Angeles">
                                    <option value="Chicago">
                                </datalist>
                            </div>
                            <div class="col-6"><label for="exampleDataList" class="form-label">Comuna</label>
                                <input class="form-control fs-7" list="datalistOptions" id="exampleDataList"
                                    placeholder="Comuna..." name="comuna">
                                <datalist id="datalistOptions">
                                    <option value="San Francisco">
                                    <option value="New York">
                                    <option value="Seattle">
                                    <option value="Los Angeles">
                                    <option value="Chicago">
                                </datalist>
                            </div>
                            <div class="my-4">
                                <button type="submit" class="btn btn-success fs-7">Crear usuario</button>
                            </div>
                        </form>
                    </div>
                    <!--fin formulario-->
                    <div class="col-6">
                        <p class="text-white fs-4">Listado de usuarios</p>
                        <table class="table rounded-2 overflow-hidden border-0">
                            <thead class="border-bottom">
                                <tr>
                                    <th scope="col" class="fs-7">Nombre</th>
                                    <th scope="col" class="fs-7">Telefono</th>
                                    <th scope="col" class="fs-7">Dirección</th>
                                    <th scope="col" class="fs-7">Correo</th>
                                </tr>
                            </thead>
                            <tbody id="user-table">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../components/admin/adminNavbar.js"></script>
    <script src="../../utils/registerForm.js"></script>
</body>

</html>
